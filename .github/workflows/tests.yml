name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, json
          coverage: none
      
      - name: Validate composer.json
        run: composer validate --strict
        working-directory: .claude/worktrees/reverent-beaver-c7065a
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: .claude/worktrees/reverent-beaver-c7065a
      
      - name: Run PHPUnit tests
        run: composer test
        working-directory: .claude/worktrees/reverent-beaver-c7065a
      
      - name: Check test results
        if: failure()
        run: |
          echo "❌ PHP tests failed on PHP ${{ matrix.php-version }}"
          exit 1

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Jest tests
        run: npm test
      
      - name: Check test results
        if: failure()
        run: |
          echo "❌ JavaScript tests failed on Node ${{ matrix.node-version }}"
          exit 1

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [php-tests, javascript-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.php-tests.result }}" == "success" ] && [ "${{ needs.javascript-tests.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed"
            echo "PHP Tests: ${{ needs.php-tests.result }}"
            echo "JavaScript Tests: ${{ needs.javascript-tests.result }}"
            exit 1
          fi
