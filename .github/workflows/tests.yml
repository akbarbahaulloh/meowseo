name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-tests:
    name: PHP Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, openssl
          coverage: none
      
      - name: Validate composer.json
        run: composer validate --strict
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run PHPUnit tests
        run: composer test
      
      - name: Check test results
        if: failure()
        run: |
          echo "❌ PHP tests failed on PHP ${{ matrix.php }}"
          exit 1

  javascript-tests:
    name: JavaScript Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node: ['18', '20']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Jest tests
        run: npm test
      
      - name: Check test results
        if: failure()
        run: |
          echo "❌ JavaScript tests failed on Node ${{ matrix.node }}"
          exit 1

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [php-tests, javascript-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.php-tests.result }}" == "success" ] && [ "${{ needs.javascript-tests.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed"
            echo "PHP Tests: ${{ needs.php-tests.result }}"
            echo "JavaScript Tests: ${{ needs.javascript-tests.result }}"
            exit 1
          fi
