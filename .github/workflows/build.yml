name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-assets:
    name: Build Assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production assets
        run: npm run build
      
      - name: Check build output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not created"
            exit 1
          fi
          
          if [ ! -f "build/index.js" ]; then
            echo "❌ index.js not built"
            exit 1
          fi
          
          echo "✅ Build successful"
          ls -lh build/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-assets
          path: build/
          retention-days: 7

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: build-assets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-assets
          path: build/
      
      - name: Verify build files
        run: |
          echo "Checking build files..."
          
          if [ -f "build/index.js" ]; then
            echo "✅ index.js exists"
            SIZE=$(stat -f%z "build/index.js" 2>/dev/null || stat -c%s "build/index.js")
            echo "   Size: $SIZE bytes"
          else
            echo "❌ index.js missing"
            exit 1
          fi
          
          if [ -f "build/index.css" ]; then
            echo "✅ index.css exists"
            SIZE=$(stat -f%z "build/index.css" 2>/dev/null || stat -c%s "build/index.css")
            echo "   Size: $SIZE bytes"
          fi
          
          echo "✅ Build verification passed"
